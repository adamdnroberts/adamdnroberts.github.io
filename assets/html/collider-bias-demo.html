<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Collider bias, live</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #212529;
        --muted: #6c757d;
        --hair: #dee2e6;
        --panel-bg: #f8f9fa;
        --accent: #3568c4;
        --accent-faint: rgba(53, 104, 196, 0.28);
        --excluded: #adb5bd;
        --excluded-faint: rgba(173, 181, 189, 0.55);
        --fit: #d9622b;
        --warn: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1d;
          --ink: #f1f4f7;
          --muted: #98a1ab;
          --hair: #3b4148;
          --panel-bg: #232427;
          --accent: #7fb3d5;
          --accent-faint: rgba(127, 179, 213, 0.3);
          --excluded: #6b7278;
          --excluded-faint: rgba(107, 114, 120, 0.55);
          --fit: #f0a15a;
          --warn: #ff8a80;
        }
      }
      html.theme-dark {
        --bg: #1c1c1d;
        --ink: #f1f4f7;
        --muted: #98a1ab;
        --hair: #3b4148;
        --panel-bg: #232427;
        --accent: #7fb3d5;
        --accent-faint: rgba(127, 179, 213, 0.3);
        --excluded: #6b7278;
        --excluded-faint: rgba(107, 114, 120, 0.55);
        --fit: #f0a15a;
        --warn: #ff8a80;
      }
      html.theme-light {
        --bg: #ffffff;
        --ink: #212529;
        --muted: #6c757d;
        --hair: #dee2e6;
        --panel-bg: #f8f9fa;
        --accent: #3568c4;
        --accent-faint: rgba(53, 104, 196, 0.28);
        --excluded: #adb5bd;
        --excluded-faint: rgba(173, 181, 189, 0.55);
        --fit: #d9622b;
        --warn: #b3261e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .wrap {
        padding: 14px 16px 20px;
        max-width: 900px;
        margin: 0 auto;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px 22px;
        margin-bottom: 10px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 13px;
        color: var(--muted);
      }
      .field.grow {
        flex: 1 1 220px;
      }
      select,
      button {
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        background: var(--panel-bg);
        border: 1px solid var(--hair);
        border-radius: 6px;
        padding: 6px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      input[type="range"] {
        accent-color: var(--accent);
        width: 100%;
        cursor: pointer;
      }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .slider-row input[type="range"] {
        width: 160px;
      }
      .pct {
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        min-width: 3.5em;
      }
      .story {
        font-size: 14px;
        color: var(--muted);
        margin: 4px 0 14px;
        min-height: 2.4em;
      }
      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 18px;
      }
      .panel {
        background: var(--panel-bg);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 10px 12px 12px;
      }
      .panel-title {
        font-size: 13px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .panel-title .n {
        font-weight: 400;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        aspect-ratio: 4 / 3;
      }
      .axis-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .stat {
        margin-top: 6px;
        font-size: 13px;
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .stat b {
        font-variant-numeric: tabular-nums;
        font-size: 15px;
      }
      .warn {
        color: var(--warn);
        font-size: 12px;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="controls">
        <div class="field grow">
          <label for="scenario">Scenario</label>
          <select id="scenario"></select>
        </div>
        <div class="field">
          <label for="stringency">How selective is the cutoff?</label>
          <div class="slider-row">
            <input type="range" id="stringency" min="5" max="90" value="30" step="1" />
            <span class="pct" id="pctLabel">top 30%</span>
          </div>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button id="resample" type="button">New random sample</button>
        </div>
      </div>

      <p class="story" id="story"></p>

      <div class="panels">
        <div class="panel">
          <div class="panel-title">
            <span id="fullTitle">Everyone</span>
            <span class="n" id="nFull"></span>
          </div>
          <canvas id="cvFull"></canvas>
          <div class="axis-labels">
            <span id="xLabelFull"></span>
            <span id="yLabelFull"></span>
          </div>
          <div class="stat">correlation <b id="rFull"></b></div>
        </div>
        <div class="panel">
          <div class="panel-title">
            <span id="selTitle">Only the ones who made it</span>
            <span class="n" id="nSel"></span>
          </div>
          <canvas id="cvSel"></canvas>
          <div class="axis-labels">
            <span id="xLabelSel"></span>
            <span id="yLabelSel"></span>
          </div>
          <div class="stat">
            correlation <b id="rSel"></b>
            <span class="warn" id="warnSmall"></span>
          </div>
        </div>
      </div>

      <p class="hint">
        Each dot is one unit. The two traits are drawn independently — the only thing that changes is which units clear the bar. Drag the slider to
        make the cutoff stricter, or draw a fresh sample.
      </p>
    </div>

    <script>
      (function () {
        "use strict";

        // ---------- theme sync with the parent page (same-origin), else prefers-color-scheme ----------
        function applyParentTheme() {
          try {
            var t = window.parent && window.parent.document.documentElement.getAttribute("data-theme");
            if (t === "dark" || t === "light") {
              document.documentElement.classList.remove("theme-dark", "theme-light");
              document.documentElement.classList.add("theme-" + t);
            }
          } catch (e) {
            /* cross-origin or no parent: fall back to prefers-color-scheme */
          }
        }
        applyParentTheme();
        setInterval(applyParentTheme, 800);

        // ---------- scenarios (framing only; the simulated data is identical) ----------
        var SCENARIOS = [
          {
            name: "Berkson's paradox: two hospital diagnoses",
            x: "Severity of condition A",
            y: "Severity of condition B",
            cutoffWord: "admitted to hospital",
            fullTitle: "Everyone in the population",
            selTitle: "Only the ones admitted to hospital",
            story:
              "In the general population, how severe these two unrelated conditions are is uncorrelated. People get admitted when either one is bad enough on its own — so among admitted patients, a mild case of one tends to come with a worse case of the other.",
          },
          {
            name: "Casting: talent and looks",
            x: "Acting talent",
            y: "Good looks",
            cutoffWord: "cast",
            fullTitle: "Everyone who auditions",
            selTitle: "Only the ones who get cast",
            story:
              "Among everyone who auditions, talent and looks are unrelated. Casting directors take people who are strong on either trait — so among working actors, the plainer ones tend to be the more talented ones.",
          },
          {
            name: "Startups: skill and luck",
            x: "Founder skill",
            y: "Luck",
            cutoffWord: "funded",
            fullTitle: "Everyone who starts a company",
            selTitle: "Only the ones who get funded",
            story:
              "Skill and luck are unrelated among everyone who tries. Investors fund the ventures that look promising, for whatever reason — so among funded startups, the lucky ones look less skilled than they are.",
          },
          {
            name: "Journals: rigor and novelty",
            x: "Methodological rigor",
            y: "Novelty of the idea",
            cutoffWord: "published",
            fullTitle: "Everyone who submits",
            selTitle: "Only the ones who get published",
            story:
              "Across all submissions, rigor and novelty are unrelated. Journals accept papers that clear a bar on either dimension — so among published papers, the flashiest ideas tend to be the least rigorous, and vice versa.",
          },
        ];

        // ---------- RNG ----------
        function randn() {
          var u = 0,
            v = 0;
          while (u === 0) u = Math.random();
          while (v === 0) v = Math.random();
          return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        }

        var N = 380;
        var data = null; // {x:[],y:[],z:[]}

        function makeSample() {
          var x = new Array(N),
            y = new Array(N),
            z = new Array(N);
          for (var i = 0; i < N; i++) {
            x[i] = randn();
            y[i] = randn();
            z[i] = x[i] + y[i];
          }
          data = { x: x, y: y, z: z };
        }

        function pearson(xs, ys) {
          var n = xs.length;
          if (n < 2) return NaN;
          var mx = 0,
            my = 0;
          for (var i = 0; i < n; i++) {
            mx += xs[i];
            my += ys[i];
          }
          mx /= n;
          my /= n;
          var sxy = 0,
            sxx = 0,
            syy = 0;
          for (i = 0; i < n; i++) {
            var dx = xs[i] - mx,
              dy = ys[i] - my;
            sxy += dx * dy;
            sxx += dx * dx;
            syy += dy * dy;
          }
          if (sxx === 0 || syy === 0) return NaN;
          return sxy / Math.sqrt(sxx * syy);
        }

        function leastSquares(xs, ys) {
          var n = xs.length;
          var mx = 0,
            my = 0;
          for (var i = 0; i < n; i++) {
            mx += xs[i];
            my += ys[i];
          }
          mx /= n;
          my /= n;
          var sxy = 0,
            sxx = 0;
          for (i = 0; i < n; i++) {
            var dx = xs[i] - mx;
            sxy += dx * (ys[i] - my);
            sxx += dx * dx;
          }
          var b = sxx === 0 ? 0 : sxy / sxx;
          var a = my - b * mx;
          return { a: a, b: b };
        }

        function selectedIndices(pctKeep) {
          var order = data.z
            .map(function (v, i) {
              return i;
            })
            .sort(function (i, j) {
              return data.z[j] - data.z[i];
            });
          var keep = Math.max(5, Math.round((N * pctKeep) / 100));
          return order.slice(0, keep);
        }

        // ---------- drawing ----------
        function setupCanvas(cv) {
          var rect = cv.getBoundingClientRect();
          var dpr = window.devicePixelRatio || 1;
          var w = Math.max(240, rect.width);
          var h = w * 0.75;
          cv.width = Math.round(w * dpr);
          cv.height = Math.round(h * dpr);
          var ctx = cv.getContext("2d");
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          return { ctx: ctx, w: w, h: h };
        }

        function css(name) {
          return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function drawScatter(cv, xs, ys, opts) {
          var setup = setupCanvas(cv),
            ctx = setup.ctx,
            w = setup.w,
            h = setup.h;
          var pad = 14;
          ctx.clearRect(0, 0, w, h);

          var xMin, xMax, yMin, yMax;
          if (opts.domain) {
            xMin = opts.domain.xMin;
            xMax = opts.domain.xMax;
            yMin = opts.domain.yMin;
            yMax = opts.domain.yMax;
          } else {
            xMin = Math.min.apply(null, xs);
            xMax = Math.max.apply(null, xs);
            yMin = Math.min.apply(null, ys);
            yMax = Math.max.apply(null, ys);
          }
          var xPad = (xMax - xMin) * 0.12 || 1;
          var yPad = (yMax - yMin) * 0.12 || 1;
          xMin -= xPad;
          xMax += xPad;
          yMin -= yPad;
          yMax += yPad;

          function px(x) {
            return pad + ((x - xMin) / (xMax - xMin)) * (w - 2 * pad);
          }
          function py(y) {
            return h - pad - ((y - yMin) / (yMax - yMin)) * (h - 2 * pad);
          }

          // zero reference lines
          ctx.strokeStyle = css("--hair");
          ctx.lineWidth = 1;
          if (xMin < 0 && xMax > 0) {
            ctx.beginPath();
            ctx.moveTo(px(0), pad);
            ctx.lineTo(px(0), h - pad);
            ctx.stroke();
          }
          if (yMin < 0 && yMax > 0) {
            ctx.beginPath();
            ctx.moveTo(pad, py(0));
            ctx.lineTo(w - pad, py(0));
            ctx.stroke();
          }

          // points
          for (var i = 0; i < xs.length; i++) {
            var isDim = opts.dim && opts.dim[i];
            ctx.beginPath();
            ctx.fillStyle = isDim ? css("--excluded-faint") : opts.color;
            ctx.arc(px(xs[i]), py(ys[i]), isDim ? 2.4 : 3.1, 0, Math.PI * 2);
            ctx.fill();
          }

          // fit line
          if (opts.fit) {
            ctx.strokeStyle = css("--fit");
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(px(xMin + xPad * 0.3), py(opts.fit.a + opts.fit.b * (xMin + xPad * 0.3)));
            ctx.lineTo(px(xMax - xPad * 0.3), py(opts.fit.a + opts.fit.b * (xMax - xPad * 0.3)));
            ctx.stroke();
          }

          // selection boundary x + y = cutoff, drawn in the "everyone" panel
          if (opts.boundary !== undefined) {
            var c = opts.boundary;
            ctx.save();
            ctx.setLineDash([5, 4]);
            ctx.strokeStyle = css("--ink");
            ctx.globalAlpha = 0.55;
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(px(xMin), py(c - xMin));
            ctx.lineTo(px(xMax), py(c - xMax));
            ctx.stroke();
            ctx.restore();
          }

          return { xMin: xMin, xMax: xMax, yMin: yMin, yMax: yMax };
        }

        function fmt(r) {
          if (isNaN(r)) return "—";
          var s = r.toFixed(2);
          if (r > 0) s = "+" + s;
          return s;
        }

        // ---------- wiring ----------
        var scenarioSel = document.getElementById("scenario");
        var stringency = document.getElementById("stringency");
        var pctLabel = document.getElementById("pctLabel");
        var resampleBtn = document.getElementById("resample");

        SCENARIOS.forEach(function (s, i) {
          var opt = document.createElement("option");
          opt.value = i;
          opt.textContent = s.name;
          scenarioSel.appendChild(opt);
        });

        function currentScenario() {
          return SCENARIOS[Number(scenarioSel.value)];
        }

        function render() {
          var sc = currentScenario();
          var pct = Number(stringency.value);
          pctLabel.textContent = "top " + pct + "%";

          document.getElementById("story").textContent = sc.story;
          document.getElementById("fullTitle").textContent = sc.fullTitle;
          document.getElementById("selTitle").textContent = sc.selTitle;
          document.getElementById("xLabelFull").textContent = "→ " + sc.x;
          document.getElementById("yLabelFull").textContent = "↑ " + sc.y;
          document.getElementById("xLabelSel").textContent = "→ " + sc.x;
          document.getElementById("yLabelSel").textContent = "↑ " + sc.y;

          var keepIdx = selectedIndices(pct);
          var keepSet = {};
          keepIdx.forEach(function (i) {
            keepSet[i] = true;
          });
          var dim = data.x.map(function (_, i) {
            return !keepSet[i];
          });

          var keep = Math.max(5, Math.round((N * pct) / 100));
          var sortedZ = data.z.slice().sort(function (a, b) {
            return b - a;
          });
          var cutoff = sortedZ[keep - 1];

          var rFull = pearson(data.x, data.y);
          document.getElementById("nFull").textContent = "n = " + N;
          document.getElementById("rFull").textContent = fmt(rFull);

          drawScatter(document.getElementById("cvFull"), data.x, data.y, {
            color: css("--accent"),
            dim: dim,
            boundary: cutoff,
          });

          var selX = keepIdx.map(function (i) {
            return data.x[i];
          });
          var selY = keepIdx.map(function (i) {
            return data.y[i];
          });
          var rSel = pearson(selX, selY);
          var fit = leastSquares(selX, selY);

          document.getElementById("nSel").textContent = "n = " + selX.length;
          document.getElementById("rSel").textContent = fmt(rSel);
          document.getElementById("warnSmall").textContent = selX.length < 20 ? "small sample — noisy estimate" : "";

          drawScatter(document.getElementById("cvSel"), selX, selY, {
            color: css("--accent"),
            fit: fit,
          });
        }

        scenarioSel.addEventListener("change", render);
        stringency.addEventListener("input", render);
        resampleBtn.addEventListener("click", function () {
          makeSample();
          render();
        });
        window.addEventListener("resize", function () {
          window.clearTimeout(window.__cbResizeT);
          window.__cbResizeT = window.setTimeout(render, 120);
        });

        makeSample();
        render();
      })();
    </script>
  </body>
</html>
